[package]
name = "obs-mcp-native"
version = "1.1.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[dependencies]
obs-mcp-resolver = {package="obs-mcp-resolver-qualification",path="crates/resolver"}
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["rt", "macros", "sync", "io-util", "io-std", "net", "time", "process", "signal"] }
tokio-tungstenite = "=0.26.2"
futures-util = { version = "=0.3.34", features = ["sink"] }
sha2 = "=0.10.9"
base64 = "=0.22.1"
getrandom = "=0.3.4"

hyper = { version = "=1.11.1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "=0.1.20", default-features = false, features = ["tokio"] }
http-body = "=1.1.0"
http-body-util = "=0.1.5"
bytes = "=1.12.1"
httparse = "=1.10.1"

[lints.rust]
unsafe_code = "forbid"
[lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[features]
platform-tls-evaluation = ["dep:obs-mcp-platform-tls"]
resolver-fixture = ["obs-mcp-resolver/resolver-fixture"]

[[test]]
name = "tls_ca_contract"
required-features = ["platform-tls-evaluation", "resolver-fixture"]

[target.'cfg(target_os = "macos")'.dependencies]
obs-mcp-platform-tls = {package="obs-mcp-platform-tls-qualification",path="crates/platform-tls",optional=true}

[target.'cfg(target_os = "linux")'.dependencies]
obs-mcp-platform-tls = {package="obs-mcp-platform-tls-qualification",path="crates/platform-tls",optional=true,features=["gnutls-probe"]}
